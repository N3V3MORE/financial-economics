[project]
name = "financial-economics"
version = "0.1.0"
description = "Reproducible ETF risk, return, and market-exposure analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    # Keep pandas 2.x on NumPy 2.3; newer timedelta deprecations fail strict checks.
    "numpy>=2.3,<2.4",
    "pandas>=2.2,<3",
    "statsmodels>=0.14.4,<0.16",
    "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
wrds = ["psycopg2-binary==2.9.13"]
prediction = ["torch==2.11.0"]
prediction-rocm = [
    "torch[device-gfx1151]==2.11.0+rocm7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    # Declare AMD runtime packages directly so uv's explicit index applies to them.
    "rocm[libraries,device-gfx1151]==7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "rocm-bootstrap==0.1.0; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "rocm-sdk-core==7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "rocm-sdk-libraries==7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "rocm-sdk-device-gfx1151==7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "amd-torch-device-gfx1151==2.11.0+rocm7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "amd-torch-device-gfx115x==2.11.0+rocm7.14.1; sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
reconstruction = ["arch==8.0.0"]

[tool.uv]
conflicts = [[{ extra = "prediction" }, { extra = "prediction-rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "prediction" },
    # Select Windows metadata explicitly; the AMD Linux wheel requires Triton.
    { url = "https://repo.amd.com/rocm/whl-multi-arch/torch-2.11.0%2Brocm7.14.1-cp312-cp312-win_amd64.whl", extra = "prediction-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" },
]
rocm = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
rocm-bootstrap = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
rocm-sdk-core = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
rocm-sdk-libraries = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
rocm-sdk-device-gfx1151 = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
amd-torch-device-gfx1151 = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }
amd-torch-device-gfx115x = { index = "amd-rocm", marker = "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "amd-rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
explicit = true

[project.scripts]
fecon = "financial_economics.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
