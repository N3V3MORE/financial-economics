[project]
name = "financial-economics"
version = "0.1.0"
description = "Reproducible ETF risk, return, and market-exposure analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    # Keep pandas 2.x on NumPy 2.3; newer timedelta deprecations fail strict checks.
    "numpy>=2.3,<2.4",
    "pandas>=2.2,<3",
    "statsmodels>=0.14.4,<0.16",
    "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
wrds = ["psycopg2-binary==2.9.13"]
prediction = ["torch==2.11.0"]
reconstruction = ["arch==8.0.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", extra = "prediction" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
fecon = "financial_economics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff==0.14.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["data", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF"]
# Typographic dashes, minus signs and multiplication signs in labels are deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib must select its non-interactive backend before pyplot is imported.
"src/financial_economics/*_report.py" = ["E402"]
"src/financial_economics/paper_figures.py" = ["E402"]
# Saved reconstruction caches are reused only while these forecasting files keep
# their recorded hashes (paper_reconstruction._code_hashes), so they stay as frozen.
"src/financial_economics/{paper_sources,paper,forecasting,paper_models,paper_networks,paper_networks_log,paper_gru,gru_forecasting}.py" = ["B905", "UP017", "RUF"]
