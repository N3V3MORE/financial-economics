[study]
name = "protection-core-2007-2025"
start = "2007-01-01"
end = "2025-12-31"
benchmark = "SPY"
trading_days = 252
hac_lags = 6

[assets]
SPY = "Broad US stock reference"
TLT = "Other assets: long government bonds"
GLD = "Other assets: gold"
DBC = "Other assets: commodities"

# These dates cover model fitting and the reconstructed 2009 calibration year.
# Portfolio evaluation starts in 2010, below. Architecture/epochs are reused
# from the saved selection through 2009; this command does no new tuning.
[paper]
training_start = "2000-01-01"
training_end = "2008-12-31"
evaluation_start = "2009-01-01"
evaluation_end = "2021-12-31"
lookback = 22
hidden_sizes = [32]
seeds = [11, 22, 33]
batch_size = 64
max_epochs = 60
patience = 8
learning_rate = 0.001
dropout = 0.10
weight_decay = 0.0001
ewma_decay = 0.94
monthly_target = 0.10
monthly_multiplier = 22

[extension]
evaluation_start = "2010-01-01"
calibration_start = "2009-01-01"
defensive_assets = ["TLT", "GLD", "DBC"]
costs_bps = [0, 10, 25]
stress_quantile = 0.90
defensive_cap = 0.20
annual_target = 0.10
risk_modes = ["paper", "annual10"]
windows = ["2010:2020", "2021:2021", "2017:2021"]
